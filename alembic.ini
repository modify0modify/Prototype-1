[alembic]
script_location = alembic
# env.py adds src/ to sys.path; avoid prepend_sys_path deprecation noise
version_path_separator = os

# Overridden by env.py / DATABASE_URL / make migrate
sqlalchemy.url = sqlite:///./reports/rl_trader.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
