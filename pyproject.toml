[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rl-trader"
version = "0.1.0"
description = "Modular reinforcement-learning stock-trading system (architecture skeleton)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Quant Project" }]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15.0",
  "yfinance>=0.2.40",
  "gymnasium>=0.29",
  "stable-baselines3>=2.3",
  "torch>=2.2",
  "scikit-learn>=1.4",
  "optuna>=3.6",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "plotly>=5.22",
  "streamlit>=1.36",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
  "mypy>=1.10",
  "pandas-stubs>=2.2",
  "types-PyYAML>=6.0",
]

[project.scripts]
rl-trader-smoke = "rl_trader.cli:run_smoke"

[tool.hatch.build.targets.wheel]
packages = ["src/rl_trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["rl_trader"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["gymnasium.*", "yfinance.*", "alembic.*"]
ignore_missing_imports = true
