# Training-mode overlay: real-data train path (processed OHLCV → EpisodeData).
# Download must cover train_start..test_end (see data.start_date / end_date).
# GPU: set training.device: cuda (RunPod). Never enables live trading.
app_mode: research
seed: 42
live_trading_enabled: false

data:
  universe: [SPY, QQQ, AAPL, MSFT]
  provider: yfinance
  timezone: UTC
  # Must span training.train_start .. training.test_end (inclusive).
  start_date: 2020-01-02
  end_date: 2022-06-30
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  cache_dir: data/interim/cache
  quality_report_dir: reports/data_quality
  jump_threshold: 0.20
  allow_missing_bars: false
  point_in_time_universe: false
  survivorship_bias_acknowledged: true

features:
  lookback_bars: 20
  normalize: false
  causal_only: true
  feature_version: "1"
  benchmark_symbol: SPY
  output_dir: data/processed/features
  manifest_dir: data/processed/features
  quality_report_dir: reports/feature_quality
  return_windows: [1, 5, 20]
  ma_windows: [5, 20]
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bollinger_period: 20
  bollinger_std: 2.0
  atr_period: 14
  volatility_window: 20
  downside_vol_window: 20
  volume_zscore_window: 20
  drawdown_window: 60
  rolling_high_window: 60
  include_portfolio_state: false
  include_fundamentals: false
  include_regime: true
  drop_na_rows: false

training:
  algorithm: ppo
  model_id: ppo-portfolio
  total_timesteps: 10000
  learning_rate: 0.0003
  batch_size: 64
  n_steps: 256
  n_epochs: 5
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  buffer_size: 50000
  learning_starts: 100
  tau: 0.005
  train_freq: 1
  gradient_steps: 1
  policy_delay: 2
  target_policy_noise: 0.2
  target_noise_clip: 0.5
  seed: 42
  # Use cuda on RunPod / GPU hosts: device: cuda
  device: cpu
  checkpoint_dir: models/checkpoints
  comparison_dir: reports/agent_comparison
  train_start: 2020-01-02
  train_end: 2021-06-30
  val_start: 2021-07-01
  val_end: 2021-12-31
  test_start: 2022-01-03
  test_end: 2022-06-30
  eval_freq: 500
  n_eval_episodes: 1
  early_stopping_patience: 5
  min_evals_before_stop: 2
  normalize_features: true
  evaluate_test_after_training: true

environment:
  initial_cash: 100000.0
  max_weight: 0.25
  commission_bps: 1.0
  bid_ask_spread_bps: 2.0
  slippage_bps: 1.0
  market_impact_coeff: 0.1
  execution_delay_bars: 1
  allow_same_bar_execution: false
  costs_already_in_return: true
  recent_returns_lookback: 5
  drawdown_penalty: 0.1
  turnover_penalty: 0.01
  transaction_cost_penalty: 1.0
  concentration_penalty: 0.05
  volatility_penalty: 0.05
  max_drawdown_terminate: 0.35
  min_portfolio_value: 1.0

risk:
  max_position_size: 0.25
  max_portfolio_exposure: 1.0
  daily_loss_limit: 0.05
  max_drawdown_limit: 0.2

broker:
  environment: paper

monitoring:
  log_level: INFO

database:
  url: sqlite:///./reports/rl_trader.db

fundamentals:
  wacc: 0.08
  terminal_growth_rate: 0.02
