# Research-mode defaults (offline experiments). No broker contact.
app_mode: research
seed: 42
live_trading_enabled: false

data:
  # SPY/QQQ benchmarks, PLTR example, plus liquid US equities
  universe: [SPY, QQQ, PLTR, AAPL, MSFT, AMZN, META, NVDA]
  provider: yfinance
  timezone: UTC
  start_date: 2023-01-03
  end_date: 2023-03-31
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  cache_dir: data/interim/cache
  quality_report_dir: reports/data_quality
  jump_threshold: 0.20
  allow_missing_bars: false

features:
  lookback_bars: 20
  normalize: false
  causal_only: true
  feature_version: "1"
  benchmark_symbol: SPY
  output_dir: data/processed/features
  manifest_dir: data/processed/features
  quality_report_dir: reports/feature_quality
  return_windows: [1, 5, 20, 60]
  ma_windows: [5, 20, 60]
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bollinger_period: 20
  bollinger_std: 2.0
  atr_period: 14
  volatility_window: 20
  downside_vol_window: 20
  volume_zscore_window: 20
  drawdown_window: 60
  rolling_high_window: 60
  regime_trend_window: 50
  regime_vol_window: 20
  vol_percentile_window: 60
  bull_threshold: 0.02
  bear_threshold: -0.02
  high_vol_percentile: 0.80
  low_vol_percentile: 0.20
  turnover_window: 5
  include_portfolio_state: true
  include_fundamentals: true
  include_regime: true
  drop_na_rows: false

training:
  algorithm: ppo
  total_timesteps: 10000
  learning_rate: 0.0003
  batch_size: 64
  gamma: 0.99
  seed: 42
  checkpoint_dir: models/checkpoints

backtest:
  initial_cash: 100000.0
  commission_bps: 1.0
  slippage_bps: 1.0
  reports_dir: reports/backtests
  walk_forward_folds: 3

# Research may omit daily_loss_limit when risk is not active; set explicitly if used.
risk:
  max_position_size: 0.25
  max_portfolio_exposure: 1.0
  daily_loss_limit: 0.05
  max_drawdown_limit: 0.2

broker:
  environment: paper

monitoring:
  log_level: INFO
  log_json: false
  audit_enabled: true

database:
  url: sqlite:///./reports/rl_trader.db

fundamentals:
  wacc: 0.08
  terminal_growth_rate: 0.02
