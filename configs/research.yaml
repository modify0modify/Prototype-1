# Research-mode defaults (offline experiments). No broker contact.
app_mode: research
seed: 42
live_trading_enabled: false

data:
  # SPY/QQQ benchmarks, PLTR example, plus liquid US equities
  universe: [SPY, QQQ, PLTR, AAPL, MSFT, AMZN, META, NVDA]
  provider: yfinance
  timezone: UTC
  start_date: 2023-01-03
  end_date: 2023-03-31
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  cache_dir: data/interim/cache
  quality_report_dir: reports/data_quality
  jump_threshold: 0.20
  allow_missing_bars: false
  point_in_time_universe: false
  # Research acknowledgement: static ticker list is survivor-biased.
  survivorship_bias_acknowledged: true

features:
  lookback_bars: 20
  normalize: false
  causal_only: true
  feature_version: "1"
  benchmark_symbol: SPY
  output_dir: data/processed/features
  manifest_dir: data/processed/features
  quality_report_dir: reports/feature_quality
  return_windows: [1, 5, 20, 60]
  ma_windows: [5, 20, 60]
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bollinger_period: 20
  bollinger_std: 2.0
  atr_period: 14
  volatility_window: 20
  downside_vol_window: 20
  volume_zscore_window: 20
  drawdown_window: 60
  rolling_high_window: 60
  regime_trend_window: 50
  regime_vol_window: 20
  vol_percentile_window: 60
  bull_threshold: 0.02
  bear_threshold: -0.02
  high_vol_percentile: 0.80
  low_vol_percentile: 0.20
  turnover_window: 5
  include_portfolio_state: true
  include_fundamentals: true
  include_regime: true
  drop_na_rows: false

training:
  algorithm: ppo
  model_id: ppo-portfolio
  total_timesteps: 10000
  learning_rate: 0.0003
  batch_size: 64
  n_steps: 256
  n_epochs: 5
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  # SAC / TD3 off-policy knobs (continuous Box actions match PortfolioEnv)
  buffer_size: 50000
  learning_starts: 100
  tau: 0.005
  train_freq: 1
  gradient_steps: 1
  policy_delay: 2
  target_policy_noise: 0.2
  target_noise_clip: 0.5
  seed: 42
  device: cpu
  checkpoint_dir: models/checkpoints
  comparison_dir: reports/agent_comparison
  # Inclusive windows — scaler fits on train only; early-stop on val; test unused for selection.
  train_start: 2020-01-02
  train_end: 2021-06-30
  val_start: 2021-07-01
  val_end: 2021-12-31
  test_start: 2022-01-03
  test_end: 2022-06-30
  eval_freq: 500
  n_eval_episodes: 1
  early_stopping_patience: 5
  min_evals_before_stop: 2
  normalize_features: true
  evaluate_test_after_training: true

# Gymnasium PortfolioEnv simulation (research — no broker).
environment:
  initial_cash: 100000.0
  max_weight: 0.25
  commission_bps: 1.0
  bid_ask_spread_bps: 2.0
  slippage_bps: 1.0
  market_impact_coeff: 0.1
  execution_delay_bars: 1
  allow_same_bar_execution: false
  costs_already_in_return: true
  recent_returns_lookback: 5
  drawdown_penalty: 0.1
  turnover_penalty: 0.01
  transaction_cost_penalty: 1.0
  concentration_penalty: 0.0
  volatility_penalty: 0.0
  max_drawdown_terminate: 0.5
  min_portfolio_value: 1.0

backtest:
  initial_cash: 100000.0
  commission_bps: 1.0
  slippage_bps: 1.0
  reports_dir: reports/backtests
  walk_forward_dir: reports/walk_forward
  walk_forward_folds: 3
  train_bars: 40
  val_bars: 10
  test_bars: 10
  step_bars: 10
  window_mode: rolling
  retrain_mode: scratch
  max_dd_threshold: 0.20
  instability_sharpe_mad_mult: 3.0
  instability_return_mad_mult: 3.0
  underperform_eps: 0.0
  algorithm: ppo
  train_timesteps: 256
  train_agent: true
  regime_feature_index: 0
  n_regime_buckets: 3
  trading_days_per_year: 252

# Deterministic baselines (shared harness; costs from environment: by default).
benchmarks:
  spy_symbol: SPY
  ma_window: 50
  momentum_lookback: 20
  momentum_top_k: 3
  mean_reversion_lookback: 5
  mean_reversion_z: 1.0
  vol_lookback: 20
  risk_parity_vol_floor: 0.000001
  trading_days_per_year: 252
  output_dir: reports/benchmarks
  use_environment_costs: true

# Research may omit daily_loss_limit when risk is not active; set explicitly if used.
risk:
  max_position_size: 0.25
  max_portfolio_exposure: 1.0
  max_sector_exposure: 0.50
  min_cash_reserve: 0.02
  max_order_notional: 50000.0
  max_daily_turnover: 1.0
  max_orders_per_day: 50
  daily_loss_limit: 0.05
  weekly_loss_limit: 0.10
  max_drawdown_limit: 0.2
  max_volatility_target: 0.35
  max_consecutive_losses: 5
  max_data_age_seconds: 300
  abnormal_price_jump: 0.20
  max_spread_bps: 50
  configuration_version: risk-v1
  kill_switch_reset_phrase: MANUAL_KILL_SWITCH_RESET

broker:
  environment: paper

monitoring:
  log_level: INFO
  log_json: false
  audit_enabled: true

database:
  url: sqlite:///./reports/rl_trader.db

fundamentals:
  # DCF assumptions for research features — NOT investment advice.
  wacc: 0.08
  terminal_growth_rate: 0.02
  forecast_horizon_years: 5
  initial_fcff_growth: 0.08
  growth_decline_per_year: 0.01
  fcff_method: auto
  annual_share_dilution: 0.0
  include_short_term_investments_in_cash: true
  sensitivity_wacc_deltas: [-0.02, -0.01, 0.0, 0.01, 0.02]
  sensitivity_g_deltas: [-0.01, -0.005, 0.0, 0.005, 0.01]
  currency: USD
  output_dir: reports/valuations
