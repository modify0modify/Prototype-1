# Paper-mode defaults (simulated execution). Default production-safe path.
app_mode: paper
seed: 42
live_trading_enabled: false

data:
  universe: [SPY, QQQ, AAPL, MSFT]
  processed_dir: data/processed

features:
  lookback_bars: 20
  causal_only: true

training:
  checkpoint_dir: models/checkpoints

backtest:
  reports_dir: reports/paper_trading

risk:
  max_position_size: 0.25
  max_portfolio_exposure: 1.0
  max_sector_exposure: 0.50
  min_cash_reserve: 0.02
  max_order_notional: 50000.0
  max_daily_turnover: 1.0
  max_orders_per_day: 50
  daily_loss_limit: 0.05
  weekly_loss_limit: 0.10
  max_drawdown_limit: 0.2
  max_volatility_target: 0.35
  max_consecutive_losses: 5
  max_data_age_seconds: 300
  abnormal_price_jump: 0.20
  max_spread_bps: 50
  configuration_version: risk-v1
  kill_switch_reset_phrase: MANUAL_KILL_SWITCH_RESET

# Paper credentials come from env (BROKER__PAPER_API_KEY / nested) — never live keys.
broker:
  environment: paper

# Formal model approval — thresholds are EXAMPLE defaults (not advice).
# Override every value for your risk appetite. Manifests must be hash-sealed.
approval:
  require_manifest_signature: false
  persist_approvals: true
  paper:
    # EXAMPLE defaults — conservative illustrations only
    min_oos_return: 0.0
    max_drawdown: 0.25
    max_turnover: 2.0
    min_evaluated_market_periods: 3
    min_regimes_evaluated: 2
    min_excess_return_vs_benchmark: 0.0
    require_transaction_costs_included: true
    require_no_critical_audit_findings: true
    require_feature_manifest_match: true
    require_model_metadata: true
    require_regression_tests_passed: true
    require_benchmark_comparison: true
  live:
    # EXAMPLE defaults — live broker remains unimplemented/stubbed
    min_paper_duration_days: 30.0
    min_paper_trades: 50
    min_paper_sharpe: 0.5
    max_paper_drawdown: 0.20
    max_slippage_difference_bps: 5.0
    require_no_unresolved_reconciliation_errors: true
    require_no_kill_switch_investigation: true
    require_manual_approval_record: true
    require_explicit_live_capital_limit: true
    require_successful_broker_sandbox_test: true

# Prospective paper-trading service (frozen model for evaluation_period_id).
paper_trading:
  state_dir: reports/paper_trading
  broker_data_dir: data/interim/paper_broker
  lock_filename: paper_trader.lock
  heartbeat_filename: heartbeat.json
  decisions_filename: decisions.jsonl
  metrics_filename: metrics.json
  alerts_filename: alerts.jsonl
  max_data_age_seconds: 300
  evaluation_period_id: paper-default
  retrain_schedule: null
  enable_scheduled_retrain_hook: false
  use_fixture_market_data: true
  commission_bps: 1.0
  spread_bps: 2.0
  slippage_bps: 1.0
  initial_cash: 100000.0

monitoring:
  log_level: INFO
  log_json: false
  audit_enabled: true

database:
  url: sqlite:///./reports/rl_trader.db
  echo: false
  # Optional SQL dual-write; file ledgers remain primary.
  persist_paper_trading: false

fundamentals:
  wacc: 0.08
  terminal_growth_rate: 0.02

live:
  acknowledgement: ""
  account_id: ""
  approved_model_manifest: models/approved/manifest.json
