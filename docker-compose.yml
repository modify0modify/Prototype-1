# Paper-only compose stack. Live trading is never enabled here.
# Usage:
#   cp .env.example .env   # edit paper credentials / paths only
#   docker compose up -d paper-trader
#   docker compose up -d dashboard
#   docker compose logs -f paper-trader

name: rl-trader-paper

services:
  paper-trader:
    build: .
    image: rl-trader:paper
    container_name: rl-trader-paper
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_MODE: paper
      LIVE_TRADING_ENABLED: "false"
      BROKER_ENVIRONMENT: paper
      MONITORING__LOG_LEVEL: INFO
      MONITORING__LOG_JSON: "true"
      MONITORING__LOG_DIR: /app/logs
      DATABASE_URL: sqlite:////app/reports/rl_trader.db
    volumes:
      - paper-data:/app/data
      - paper-reports:/app/reports
      - paper-models:/app/models/checkpoints
      - paper-logs:/app/logs
      - ./configs:/app/configs:ro
      - ./models/approved:/app/models/approved:ro
    command:
      - python
      - scripts/run_paper_trader.py
      - --config
      - configs/paper.yaml
      - --demo
      - --loop
      - --interval-seconds
      - "60"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "scripts/healthcheck_paper.py",
          "--heartbeat",
          "/app/reports/paper_trading/heartbeat.json",
          "--max-age-seconds",
          "180",
          "--allow-starting",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Process lock lives on the reports volume (paper_trader.lock).

  dashboard:
    image: rl-trader:paper
    container_name: rl-trader-dashboard
    restart: unless-stopped
    depends_on:
      paper-trader:
        condition: service_started
    env_file:
      - .env
    environment:
      APP_MODE: paper
      LIVE_TRADING_ENABLED: "false"
      BROKER_ENVIRONMENT: paper
    volumes:
      - paper-reports:/app/reports:ro
      - paper-data:/app/data:ro
      - ./configs:/app/configs:ro
    command:
      - python
      - scripts/run_dashboard.py
      - --host
      - 0.0.0.0
      - --port
      - "8505"
    ports:
      - "8505:8505"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8505/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  paper-data:
  paper-reports:
  paper-models:
  paper-logs:
